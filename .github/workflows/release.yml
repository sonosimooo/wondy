name: Pubblica Wondy per Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag della release da pubblicare
        required: true
        default: v0.0.1

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verifica che il tag corrisponda alla versione
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Il tag $env:RELEASE_TAG non corrisponde alla versione v$version in package.json."
          }

      - name: Installa dipendenze
        run: npm ci

      - name: Crea e pubblica installer e metadati di aggiornamento
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifica e carica installer e file di aggiornamento
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/Wondy-$version-Setup.exe"
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer, "dist/latest.yml", $blockmap)) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "File necessario per gli aggiornamenti non trovato: $file"
            }
          }
          gh release upload $env:RELEASE_TAG $installer --clobber
          if ($LASTEXITCODE -ne 0) { throw "Caricamento installer non riuscito." }
          gh release upload $env:RELEASE_TAG "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Caricamento latest.yml non riuscito." }
          gh release upload $env:RELEASE_TAG $blockmap --clobber
          if ($LASTEXITCODE -ne 0) { throw "Caricamento blockmap non riuscito." }
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Impossibile verificare gli asset della release." }
          foreach ($requiredAsset in @([IO.Path]::GetFileName($installer), "latest.yml", [IO.Path]::GetFileName($blockmap))) {
            if ($assets -notcontains $requiredAsset) {
              throw "Asset mancante nella release $env:RELEASE_TAG`: $requiredAsset"
            }
          }
